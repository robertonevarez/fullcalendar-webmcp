services:
  - type: web
    name: protocoltooling
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/protocoltooling.db
      - key: DEMO_RESET_TOKEN
        sync: false
    disk:
      name: protocoltooling-data
      mountPath: /var/data
      sizeGB: 1
