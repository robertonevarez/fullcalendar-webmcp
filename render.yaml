services:
  - type: web
    name: schedulemcp
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/schedulemcp.db
      - key: DEMO_RESET_TOKEN
        sync: false
    disk:
      name: schedulemcp-data
      mountPath: /var/data
      sizeGB: 1
